<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión dinámica del DOM</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <!-- Título principal -->
        <h1>Lista de Notas</h1>
        <p>
            Escribe una nota y agrégala a la lista.
        </p>

        <!-- Input para escribir notas -->
        <input type="text" id="notaInput" placeholder="Escribe una nota">

        <!-- Botón para agregar -->
        <button id="agregarBtn">
            Agregar
        </button>

        <!-- Lista donde se renderizan las notas -->
        <ul id="listaNotas"></ul>

    </div>
    <script src="app.js"></script>

</body>

</html>
